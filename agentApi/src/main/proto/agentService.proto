syntax = "proto3";

package world.willfrog.alphafrogmicro.agent.idl;

option java_multiple_files = true;
option java_package = "world.willfrog.alphafrogmicro.agent.idl";
option java_outer_classname = "AgentServiceProto";

message AgentEmpty {}

message AgentRunMessage {
  string id = 1;
  string user_id = 2;
  string status = 3;
  int32 current_step = 4;
  int32 max_steps = 5;
  string plan_json = 6;
  string snapshot_json = 7;
  string last_error = 8;
  string ttl_expires_at = 9;
  string started_at = 10;
  string updated_at = 11;
  string completed_at = 12;
  string ext = 13;
}

message CreateAgentRunRequest {
  string user_id = 1;
  string message = 2;
  string context_json = 3;
  string idempotency_key = 4;
  string model_name = 5;
  string endpoint_name = 6;
  bool capture_llm_requests = 7;
  string provider = 8;
  int32 planner_candidate_count = 9;
  bool debug_mode = 10;
  string stage_config_json = 11;  // 各阶段 LLM 配置（包含 planning/execution/sub_agent）
}

message GetAgentRunRequest {
  string user_id = 1;
  string id = 2;
}

message UpdateAgentRunRequest {
  string user_id = 1;
  string id = 2;
  string title = 3;
}

message ListAgentRunsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string status = 4;
  int32 days = 5;
}

message AgentRunListItemMessage {
  string id = 1;
  string message = 2;
  string status = 3;
  string created_at = 4;
  string completed_at = 5;
  bool has_artifacts = 6;
  int64 duration_ms = 7;
  int32 total_tokens = 8;
  int32 tool_calls = 9;
}

message ListAgentRunsResponse {
  repeated AgentRunListItemMessage items = 1;
  int32 total = 2;
  bool has_more = 3;
}

message CancelAgentRunRequest {
  string user_id = 1;
  string id = 2;
}

message DeleteAgentRunRequest {
  string user_id = 1;
  string id = 2;
}

message PauseAgentRunRequest {
  string user_id = 1;
  string id = 2;
}

message ResumeAgentRunRequest {
  string user_id = 1;
  string id = 2;
  string plan_override_json = 3;
}

message AgentRunEventMessage {
  int64 id = 1;
  string run_id = 2;
  int32 seq = 3;
  string event_type = 4;
  string payload_json = 5;
  string created_at = 6;
}

message ListAgentRunEventsRequest {
  string user_id = 1;
  string id = 2;
  int32 after_seq = 3;
  int32 limit = 4;
  bool latest = 5; // true 时忽略 after_seq，返回最近 limit 条事件（按 seq 升序输出）
}

message ListAgentRunEventsResponse {
  repeated AgentRunEventMessage items = 1;
  int32 next_after_seq = 2;
  bool has_more = 3;
}

message GetAgentRunResultRequest {
  string user_id = 1;
  string id = 2;
}

message GetAgentRunCostRequest {
  string user_id = 1;
  string id = 2;
}

message AgentLlmCallCostMessage {
  string trace_id = 1;
  string generation_id = 2;
  string phase = 3;
  string todo_id = 4;
  string endpoint = 5;
  string model = 6;
  double actual_cost = 7;
  bool has_actual_cost = 8;
  double upstream_inference_cost = 9;
  bool has_upstream_inference_cost = 10;
  double cache_discount = 11;
  bool has_cache_discount = 12;
  bool is_byok = 13;
  bool has_is_byok = 14;
  int64 started_at_ms = 15;
  int64 completed_at_ms = 16;
  string source = 17;
}

message AgentRunCostMessage {
  string id = 1;
  double total_cost = 2;
  bool has_total_cost = 3;
  double upstream_inference_cost = 4;
  bool has_upstream_inference_cost = 5;
  double cache_discount = 6;
  bool has_cache_discount = 7;
  int32 costed_call_count = 8;
  int32 total_call_count = 9;
  bool complete = 10;
  string currency = 11;
  string source = 12;
  string updated_at = 13;
  bool persisted = 14;
  repeated AgentLlmCallCostMessage calls = 15;
}

message GetAgentRunStatusRequest {
  string user_id = 1;
  string id = 2;
}

message AgentRunResultMessage {
  string id = 1;
  string status = 2;
  string answer = 3;
  string payload_json = 4;
  string observability_json = 5;
  int32 total_credits_consumed = 6;
  string answer_markdown = 7;
  string structured_answer_json = 8;
}

message AgentRunStatusMessage {
  string id = 1;
  string status = 2;
  string phase = 3;
  string current_tool = 4;
  string last_event_type = 5;
  string last_event_at = 6;
  string last_event_payload_json = 7;
  string plan_json = 8;
  string progress_json = 9;
  string observability_json = 10;
  int32 total_credits_consumed = 11;
  int32 event_count = 12;
  int64 started_at_ms = 13;
  int64 completed_at_ms = 14;
  int64 elapsed_ms = 15;
  string observability_summary_json = 16;
  bool observability_full_available = 17;
}

message AgentToolMessage {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
}

message ListAgentToolsRequest {
  string user_id = 1;
}

message ListAgentToolsResponse {
  repeated AgentToolMessage items = 1;
}

message AgentArtifactMessage {
  string artifact_id = 1;
  string type = 2;
  string name = 3;
  string content_type = 4;
  string url = 5;
  string meta_json = 6;
  string created_at = 7;
  int64 expires_at_millis = 8;
}

message ListAgentArtifactsRequest {
  string user_id = 1;
  string id = 2;
  bool is_admin = 3;
}

message ListAgentArtifactsResponse {
  repeated AgentArtifactMessage items = 1;
}

message DownloadAgentArtifactRequest {
  string user_id = 1;
  string artifact_id = 2;
  bool is_admin = 3;
}

message DownloadAgentArtifactResponse {
  string artifact_id = 1;
  string filename = 2;
  string content_type = 3;
  bytes content = 4;
}

message GetAgentConfigRequest {
  string user_id = 1;
}

message AgentModelMessage {
  string id = 1;
  string display_name = 2;
  string endpoint = 3;
  string composite_id = 4;
  double base_rate = 5;
  repeated string features = 6;
  repeated string valid_providers = 7;
}

message ListAgentModelsRequest {
  string user_id = 1;
}

message ListAgentModelsResponse {
  repeated AgentModelMessage models = 1;
}

message GetAgentCreditsRequest {
  string user_id = 1;
}

message GetAgentCreditsResponse {
  int32 total_credits = 1;
  int32 remaining_credits = 2;
  int32 used_credits = 3;
  string reset_cycle = 4;
  string next_reset_at = 5;
}

message ApplyAgentCreditsRequest {
  string user_id = 1;
  int32 amount = 2;
  string reason = 3;
  string contact = 4;
}

message ApplyAgentCreditsResponse {
  string application_id = 1;
  int32 total_credits = 2;
  int32 remaining_credits = 3;
  int32 used_credits = 4;
  string status = 5;
  string applied_at = 6;
}

// ---- 260612-01-04: 单次 run 的 credit 消耗明细查询 ----

message GetAgentRunCreditsRequest {
  string user_id = 1;
  string id = 2;
  bool is_admin = 3;
}

message RefreshAgentRunCreditsRequest {
  string user_id = 1;
  string id = 2;
  bool is_admin = 3;
}

message AgentRunCreditRecordMessage {
  string call_id = 1;             // 对外标识 (llm_call_id)
  string phase = 2;               // planning / execution / sub_agent；可空
  string todo_id = 3;             // 关联 todo node；可空
  string endpoint = 4;            // openrouter / fireworks / dashscope-cn / dashscope-sg
  string model = 5;               // 实际调用模型
  string cost_source = 6;         // OPENROUTER_ACTUAL / OPENROUTER_FALLBACK / PER_CALL
  string currency = 7;            // 当前固定 USD
  string cost_amount = 8;         // 原始 cost（string, USD; PER_CALL 端点可空）
  string credit_delta = 9;        // 实际扣减的 credit
  int32 settlement_attempt = 10;  // 1=immediate, 2=delayed retry
  string settlement_status = 11;  // SETTLED / PENDING_RETRY / MISSING
  string reason = 12;             // 关联 ledger 的 reason
  string created_at = 13;
}

message AgentRunCreditSettlementSummaryMessage {
  int32 immediate_count = 1;      // settlement_attempt == 1 && status == SETTLED
  int32 delayed_count = 2;        // settlement_attempt == 2 && status == SETTLED
  int32 pending_count = 3;        // status == PENDING_RETRY
  int32 missing_count = 4;        // status == MISSING
  int32 total_call_count = 5;
  string currency = 6;
  string total_credits = 7;       // 来自 summary 表的长期保存值
  string last_settlement_at = 8;  // summary 表新增字段
}

message GetAgentRunCreditsResponse {
  string run_id = 1;
  string owner_user_id = 2;
  string total_credits = 3;
  string currency = 4;
  repeated AgentRunCreditRecordMessage records = 5;  // 按 created_at 升序
  AgentRunCreditSettlementSummaryMessage summary = 6;
  string updated_at = 7;
}

message AgentRetentionConfigMessage {
  int32 normal_days = 1;
  int32 admin_days = 2;
}

message AgentFeatureConfigMessage {
  bool parallel_execution = 1;
  bool pause_resume = 2;
}

message GetAgentConfigResponse {
  AgentRetentionConfigMessage retention_days = 1;
  int32 max_polling_interval = 2;
  AgentFeatureConfigMessage features = 3;
}

message SubmitAgentFeedbackRequest {
  string user_id = 1;
  string id = 2;
  int32 rating = 3;
  string comment = 4;
  string tags_json = 5;
  string payload_json = 6;
}

message ExportAgentRunRequest {
  string user_id = 1;
  string id = 2;
  string format = 3;
}

message ExportAgentRunResponse {
  string export_id = 1;
  string status = 2;
  string url = 3;
  string message = 4;
}

// 消息内容
message AgentRunMessageItem {
  int64 id = 1;
  int32 seq = 2;
  string role = 3;        // "user" | "assistant" | "system"
  string content = 4;
  string msg_type = 5;    // "initial" | "follow_up" | "summary"
  string meta_json = 6;   // 元数据 JSON
  string created_at = 7;
}

// 发送消息请求
message SendAgentMessageRequest {
  string user_id = 1;
  string run_id = 2;
  string content = 3;           // 用户消息内容
  string context_override = 4;  // 可选：上下文覆盖（仅 admin + debugMode 可用）
  bool stream = 5;              // 是否流式响应（预留）
}

// 发送消息响应
message SendAgentMessageResponse {
  int64 message_id = 1;         // 消息 ID
  int32 seq = 2;                // 分配的序号
  string status = 3;            // "accepted" | "rejected"
  string run_status = 4;        // 处理后的 run 状态
  string reject_reason = 5;     // 拒绝原因（如被拒绝）
}

// 获取消息历史请求
message ListAgentMessagesRequest {
  string user_id = 1;
  string run_id = 2;
  int32 limit = 3;              // 默认 50，最大 200
  int32 offset = 4;             // 分页偏移
  bool include_initial = 5;     // 是否包含初始问题（默认 true）
}

// 获取消息历史响应
message ListAgentMessagesResponse {
  repeated AgentRunMessageItem items = 1;
  int32 total = 2;
  bool has_more = 3;
}

message GetAgentSnapshotPartsRequest {
  string user_id = 1;
  string id = 2;
  int32 max_part_size = 3;
}

message AgentSnapshotPartsMetaMessage {
  string run_id = 1;
  int32 part_size = 2;
  int32 total_parts = 3;
  int64 uncompressed_size = 4;
  int64 compressed_size = 5;
  string compression = 6;
  string checksum = 7;
}

message GetAgentSnapshotPartRequest {
  string user_id = 1;
  string id = 2;
  int32 part_index = 3;
  int32 max_part_size = 4;
}

message AgentSnapshotPartMessage {
  string run_id = 1;
  int32 part_index = 2;
  int32 part_size = 3;
  int32 total_parts = 4;
  bytes content = 5;
  string compression = 6;
}

service AgentDubboService {
  rpc CreateRun(CreateAgentRunRequest) returns (AgentRunMessage);
  rpc GetRun(GetAgentRunRequest) returns (AgentRunMessage);
  rpc UpdateRun(UpdateAgentRunRequest) returns (AgentRunMessage);
  rpc ListRuns(ListAgentRunsRequest) returns (ListAgentRunsResponse);
  rpc ListEvents(ListAgentRunEventsRequest) returns (ListAgentRunEventsResponse);
  rpc DeleteRun(DeleteAgentRunRequest) returns (AgentEmpty);
  rpc CancelRun(CancelAgentRunRequest) returns (AgentRunMessage);
  rpc PauseRun(PauseAgentRunRequest) returns (AgentRunMessage);
  rpc ResumeRun(ResumeAgentRunRequest) returns (AgentRunMessage);
  rpc GetResult(GetAgentRunResultRequest) returns (AgentRunResultMessage);
  rpc GetRunCost(GetAgentRunCostRequest) returns (AgentRunCostMessage);
  rpc GetStatus(GetAgentRunStatusRequest) returns (AgentRunStatusMessage);
  rpc ListTools(ListAgentToolsRequest) returns (ListAgentToolsResponse);
  rpc ListArtifacts(ListAgentArtifactsRequest) returns (ListAgentArtifactsResponse);
  rpc DownloadArtifact(DownloadAgentArtifactRequest) returns (DownloadAgentArtifactResponse);
  rpc GetConfig(GetAgentConfigRequest) returns (GetAgentConfigResponse);
  rpc ListModels(ListAgentModelsRequest) returns (ListAgentModelsResponse);
  rpc GetCredits(GetAgentCreditsRequest) returns (GetAgentCreditsResponse);
  rpc ApplyCredits(ApplyAgentCreditsRequest) returns (ApplyAgentCreditsResponse);
  rpc GetRunCredits(GetAgentRunCreditsRequest) returns (GetAgentRunCreditsResponse);
  rpc RefreshRunCredits(RefreshAgentRunCreditsRequest) returns (GetAgentRunCreditsResponse);
  rpc SubmitFeedback(SubmitAgentFeedbackRequest) returns (AgentEmpty);
  rpc ExportRun(ExportAgentRunRequest) returns (ExportAgentRunResponse);
  rpc SendMessage(SendAgentMessageRequest) returns (SendAgentMessageResponse);
  rpc ListMessages(ListAgentMessagesRequest) returns (ListAgentMessagesResponse);
  rpc GetSnapshotPartsMeta(GetAgentSnapshotPartsRequest) returns (AgentSnapshotPartsMetaMessage);
  rpc GetSnapshotPart(GetAgentSnapshotPartRequest) returns (AgentSnapshotPartMessage);
}
