server:
  address: ${AF_BETA_CONTROLLER_BIND_ADDRESS:127.0.0.1}
  port: ${AF_BETA_CONTROLLER_PORT:19090}
spring:
  application:
    name: beta-deployment-controller
  autoconfigure:
    exclude:
      - org.apache.dubbo.spring.boot.autoconfigure.DubboAutoConfiguration
      - org.apache.dubbo.spring.boot.autoconfigure.DubboRelaxedBindingAutoConfiguration
      - org.apache.dubbo.spring.boot.autoconfigure.DubboRelaxedBinding2AutoConfiguration
      - org.apache.dubbo.spring.boot.autoconfigure.DubboListenerAutoConfiguration
  main:
    banner-mode: "off"
dubbo:
  enabled: false
  registry:
    address: N/A
    register: false
  application:
    qos-enable: false
alphafrog:
  beta-controller:
    enabled: ${AF_BETA_CONTROLLER_ENABLED:false}
    state-root: ${AF_BETA_CONTROLLER_STATE_ROOT:/var/lib/alphafrog-beta}
    reconcile-delay: ${AF_BETA_CONTROLLER_RECONCILE_DELAY:PT2S}
    failed-candidate-retain: ${AF_BETA_FAILED_CANDIDATE_RETAIN:PT120S}
    application-drain-seconds: ${AF_BETA_APPLICATION_DRAIN_SECONDS:60}
    api-token-file: ${AF_BETA_CONTROLLER_API_TOKEN_FILE:/etc/alphafrog-beta/secrets/controller-api-token}
    healthcheck-script: ${AF_BETA_HEALTHCHECK_SCRIPT:/opt/alphafrog-beta/bin/tcp-healthcheck}
    nacos:
      server-address: ${AF_BETA_NACOS_SERVER_ADDRESS:}
      namespace: ${AF_CONFIG_NACOS_NAMESPACE:public}
      username: ${AF_CONFIG_NACOS_USERNAME:}
      password: ${AF_CONFIG_NACOS_PASSWORD:}
    observability:
      traces-endpoint: ${AF_OTEL_TRACES_ENDPOINT:}
      java-agent-jar: ${AF_BETA_OTEL_JAVAAGENT_JAR:/opt/alphafrog-beta/otel/opentelemetry-javaagent.jar}
    tool-job-test-control:
      enabled: ${AF_BETA_TOOL_JOB_TEST_CONTROL_ENABLED:false}
      jdbc-url: ${AF_BETA_TOOL_JOB_TEST_JDBC_URL:}
      username: ${AF_BETA_TOOL_JOB_TEST_DB_USERNAME:}
      password-file: ${AF_BETA_TOOL_JOB_TEST_DB_PASSWORD_FILE:/etc/alphafrog-beta/secrets/tool-job-test-db-password}
      maximum-fault-ttl-seconds: ${AF_BETA_TOOL_JOB_TEST_MAXIMUM_FAULT_TTL_SECONDS:1800}
      restart-timeout: ${AF_BETA_TOOL_JOB_TEST_RESTART_TIMEOUT:PT2M}
