# Recovery Probes 配置文件 — 仅含 placeholder，真实凭据从环境变量读取
# 用法: python test_scripts/data_intense/p0/recovery_probes/<probe>.py --config config.yml

base_url: "http://localhost:8090"
# API 凭据从环境变量读取: ALPHAFROG_USERNAME, ALPHAFROG_PASSWORD
verify_ssl: false

log_level: INFO
log_dir: output/logs
log_suffix: recovery_probes
output_root: output/data

# 数据库连接 — 真实凭据只从环境变量读取
# ALPHAFROG_PG_DSN=postgresql://user:pass@host:port/dbname
# 或分别设置: PG_HOST, PG_PORT, PG_USER, PG_PASSWORD, PG_DATABASE

# Redis 连接 — 真实凭据只从环境变量读取
# AF_REDIS_HOST, AF_REDIS_PORT, AF_REDIS_PASSWORD, AF_REDIS_DB

# 轮询参数
poll:
  status_interval_ms: 2000
  status_timeout_ms: 120000
  recovery_timeout_ms: 300000
  recovery_interval_ms: 3000
  redis_rebuild_wait_seconds: 65  # >= configured rebuild interval (60s) + margin

# Safety 门禁配置
safety:
  # allowlist run_id prefix — 只允许注入匹配此前缀的 run
  allowed_run_prefix: "t5-fixture-"

api:
  create_endpoint: "/api/agent/runs"
  status_endpoint_template: "/api/agent/runs/{run_id}/status"
  result_endpoint_template: "/api/agent/runs/{run_id}/result"
  pause_endpoint_template: "/api/agent/runs/{run_id}:pause"
  resume_endpoint_template: "/api/agent/runs/{run_id}:resume"
  observability_endpoint_template: "/api/agent/runs/{run_id}/observability/full"

# 测试场景开关
probes:
  postgresql_anchor_fault: true
  redis_eviction: true
  sandbox_crash: true
  capacity_ledger_recovery: true
  finalizer_restart: true
