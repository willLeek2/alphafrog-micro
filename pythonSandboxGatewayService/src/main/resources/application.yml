server:
  port: 18095

spring:
  application:
    name: python-sandbox-gateway-service

dubbo:
  application:
    name: python-sandbox-gateway-service
    # 当前集群沿用 Dubbo 2 风格的接口级服务发现，显式关闭 Dubbo 3 默认的应用级双注册/双订阅
    register-mode: interface
  protocol:
    name: tri
    port: 50060
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848
    # 当前未使用 Nacos 作为 Dubbo 配置中心，显式关闭默认兜底，避免启动时额外做 config-center 健康检查
    use-as-config-center: false
    # 当前未使用 Nacos 作为 Dubbo 元数据中心，显式关闭默认兜底，避免启动时额外做 metadata-center 健康检查
    use-as-metadata-center: false

sandbox:
  service:
    url: ${AF_SANDBOX_SERVICE_URL:http://localhost:8095}
    # 260809-26Q3-stage1-w3 D13: Gateway HTTP client timeouts.
    # Connect timeout covers TCP/SSL handshake; same for both long and short
    # clients (fast-fail network issues, seconds-scale).
    connect-timeout-millis: ${AF_SANDBOX_CONNECT_TIMEOUT_MILLIS:5000}
    # Long-path read timeout applies to createTask + getTaskResult (downstream
    # may run max task duration + queue/prepare overhead). MUST be >= platform
    # max task timeout + queue/prepare margin. Default 35 min covers 30 min task
    # + 5 min queue/prepare/final-write margin; operators may override.
    long-read-timeout-millis: ${AF_SANDBOX_LONG_READ_TIMEOUT_MILLIS:2100000}
    # Short-query read timeout applies to getTaskStatus + getTaskByOperationId
    # + cancelTask (D11). These should return near-instantly; shorter timeout
    # avoids Dubbo business thread being held on slow status queries.
    short-read-timeout-millis: ${AF_SANDBOX_SHORT_READ_TIMEOUT_MILLIS:10000}
    # 260809-26Q3-stage1-w3 D13 MUST-FIX 3 (Cindy 91490076 #3 + 6a6e6158):
    # Platform max task timeout. Gateway rejects createTask requests whose
    # effective timeout (max of legacy timeoutSeconds * 1000 and canonical
    # timeoutMillis) exceeds this value — local INVALID_ARGUMENT reject with
    # downstream_http_status absent. Default 30 min (1800000ms); MUST stay in
    # lock-step with Python-side max_task_timeout_seconds (ccqwen 5c543fea).
    max-task-timeout-millis: ${AF_SANDBOX_MAX_TASK_TIMEOUT_MILLIS:1800000}
    # Queue + prepare margin used to prove long-read >= max-task-timeout + margin
    # (long-path HTTP budget must cover downstream task duration + overhead).
    # This margin is NOT a request-side extension — business task limit is bound
    # by max-task-timeout-millis alone (Cindy 6a6e6158).
    queue-prepare-margin-millis: ${AF_SANDBOX_QUEUE_PREPARE_MARGIN_MILLIS:300000}

# 260605-2 §3: gateway-side observability.
# Default to INFO so that sandbox.createTask / sandbox.getTaskStatus / sandbox.getTaskResult
# entry + RestTemplate duration lines surface in normal operation.
logging:
  level:
    world.willfrog.sandbox: ${LOGGING_LEVEL_PYTHON_SANDBOX_GATEWAY:INFO}
