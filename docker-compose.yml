      AF_EXTERNAL_INFO_SEARCH_PPLX_API_KEY: ${AF_EXTERNAL_INFO_SEARCH_PPLX_API_KEY:-}
      AF_EXTERNAL_INFO_SEARCH_TAVILY_API_KEY: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_API_KEY:-}
      AF_EXTERNAL_INFO_SEARCH_EXA_API_KEY: ${AF_EXTERNAL_INFO_SEARCH_EXA_API_KEY:-}
      LOGGING_LEVEL_EXTERNAL_INFO: ${LOGGING_LEVEL_EXTERNAL_INFO:-INFO}
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      # 热点 WebSearch 缓存与统计使用 Redis；默认连接本 compose 内的 redis 服务
      AF_REDIS_HOST: redis
      AF_REDIS_PORT: 6379
      AF_REDIS_PASSWORD: ${AF_REDIS_PASSWORD:-Excited1s}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${AF_REDIS_PASSWORD:-Excited1s}
      AF_QDRANT_HOST: shared-qdrant
      AF_QDRANT_PORT: 6334
      AF_QDRANT_HTTP_PORT: 6333
      AF_RAG_EMBEDDING_CONFIG_FILE: ${AF_RAG_EMBEDDING_CONFIG_FILE:-/app/config-dynamic/rag-embedding.local.json}
      AF_EMBEDDING_API_KEY: ${AF_EMBEDDING_API_KEY:-}
      # HTTP/HTTPS 代理（访问 Perplexity/Exa/Tavily 等境外服务时使用）。
      # 使用 service-specific 变量，避免部署机 shell 的 HTTP_PROXY=http://127.0.0.1:7890
      # 被直接带入容器；容器内 127.0.0.1 指向容器自身，不是宿主机代理。
      HTTP_PROXY: ${AF_EXTERNAL_INFO_HTTP_PROXY-http://host.docker.internal:7890}
      HTTPS_PROXY: ${AF_EXTERNAL_INFO_HTTPS_PROXY-http://host.docker.internal:7890}
      http_proxy: ${AF_EXTERNAL_INFO_HTTP_PROXY-http://host.docker.internal:7890}
      https_proxy: ${AF_EXTERNAL_INFO_HTTPS_PROXY-http://host.docker.internal:7890}
      NO_PROXY: ${AF_EXTERNAL_INFO_NO_PROXY-localhost,127.0.0.1,::1,nacos,redis,rabbitmq,meilisearch,shared-qdrant,host.docker.internal}
      no_proxy: ${AF_EXTERNAL_INFO_NO_PROXY-localhost,127.0.0.1,::1,nacos,redis,rabbitmq,meilisearch,shared-qdrant,host.docker.internal}
      AF_OSS_ENDPOINT: ${AF_OSS_ENDPOINT:-oss-ap-southeast-1-internal.aliyuncs.com}
      AF_OSS_BUCKET: ${AF_OSS_BUCKET}
      AF_OSS_ACCESS_KEY_ID: ${AF_OSS_ACCESS_KEY_ID}
      AF_OSS_ACCESS_KEY_SECRET: ${AF_OSS_ACCESS_KEY_SECRET}
      AF_OSS_PATH_PREFIX: ${AF_OSS_PATH_PREFIX:-alphafrog-rag}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m ${AF_EXTERNAL_INFO_JAVA_PROXY_OPTIONS--Dhttp.proxyHost=host.docker.internal -Dhttp.proxyPort=7890 -Dhttps.proxyHost=host.docker.internal -Dhttps.proxyPort=7890 -Dhttp.nonProxyHosts=localhost|127.0.0.1|nacos|redis|rabbitmq|meilisearch|shared-qdrant|host.docker.internal}"
      DUBBO_PROTOCOL_HOST: ${DUBBO_PROTOCOL_HOST:-}
    volumes:
      - ./externalInfoService/config:/app/config:ro
      - ./data/external-info-configs:/app/config-dynamic
    ports:
      - "50061:50061"
    deploy:
      resources:
        limits:
          memory: 768M
    # external-info-service 连接两个网络：
    #   eth0 = shared-infra (外部网络，Docker 会先连接 external 网络)
    #   eth1 = alphafrog-network (项目内部网络，Dubbo 应该注册到这个网络的 IP)
    # IP 获取逻辑已移至 Dockerfile 的 entrypoint.sh
    networks:
      - alphafrog-network
      - shared-infra          # eth1，仅用于 DNS 解析 shared-qdrant 容器名

  python-sandbox-service:
    image: alphafrog-python-sandbox:latest
    build: ./pythonSandboxService
    container_name: alphafrog-python-sandbox-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AF_SANDBOX_DATA_DIR: /data/database_fetched
      AF_SANDBOX_DEBUG: ${AF_SANDBOX_DEBUG:-false}
      AF_SANDBOX_MAX_CONCURRENCY: ${AF_SANDBOX_MAX_CONCURRENCY:-20}
      AF_SANDBOX_EXECUTION_TIMEOUT: ${AF_SANDBOX_EXECUTION_TIMEOUT:-5}
      # D13 release-binding (codex a1b749ad single-writer裁定): canonical companion
      # _SECONDS + _MILLIS 必须同值绑定 (millis == seconds*1000)，Python load_config
      # 经 validate_max_task_timeout_binding 校验 fail-fast。两 service _MILLIS 同读
      # 外层 AF_SANDBOX_MAX_TASK_TIMEOUT_MILLIS，deployer 设一个两 service 同接。
      AF_SANDBOX_MAX_TASK_TIMEOUT_SECONDS: ${AF_SANDBOX_MAX_TASK_TIMEOUT_SECONDS:-1800}
      AF_SANDBOX_MAX_TASK_TIMEOUT_MILLIS: ${AF_SANDBOX_MAX_TASK_TIMEOUT_MILLIS:-1800000}
      AF_SANDBOX_MEMORY: ${AF_SANDBOX_MEMORY:-512m}
      AF_SANDBOX_MEMSWAP: ${AF_SANDBOX_MEMSWAP:-512m}
      AF_SANDBOX_BACKEND: ${AF_SANDBOX_BACKEND:-docker}
      AF_SANDBOX_WORKDIR: /sandbox
      AF_SANDBOX_LOG_LEVEL: ${AF_SANDBOX_LOG_LEVEL:-INFO}
      # MethodSpec V5 §12：生产 AF_SANDBOX_IMAGE 必须是 sha256 摘要引用（frog 发布时固定），
      # 例如 registry.example/alphafrog/runtime@sha256:<64hex>（勿用占位符 REPLACE_WITH_...）。
      # 此处【没有默认值】（round-2 R2-4）：未显式设置时透传为空，python-sandbox-service
      # 会在配置加载时大声报错，绝不静默退回 latest。裸标签仅在显式设置
      # AF_SANDBOX_IMAGE_ALLOW_DEV_TAG=true/1 且引用语法合法时允许。
      AF_SANDBOX_IMAGE: ${AF_SANDBOX_IMAGE:-}
      AF_SANDBOX_IMAGE_ALLOW_DEV_TAG: ${AF_SANDBOX_IMAGE_ALLOW_DEV_TAG:-}
      # MethodSpec V5 §12 / 工作包 C 契约身份：沙箱子进程降权目标。运行时镜像
      # （Dockerfile.runtime）固定创建非特权用户 alphafrog-sandbox（uid 10000，
      # gid 10001，均非零）；此变量接受【用户名】或【uid:gid】两种形式，例如
      # alphafrog-sandbox 或 10000:10001。工作包 C 的 wrapper 据此降权，镜像本身不切换 USER。
      AF_SANDBOX_CHILD_USER: ${AF_SANDBOX_CHILD_USER:-alphafrog-sandbox}
      # MethodSpec V5 §12 运行时镜像保留（pythonSandboxService/scripts/prune_runtime_images.sh）：
      # 保护集 = 当前镜像 + 上一代镜像 + state.json 中 QUEUED/RUNNING 任务引用的镜像 + 运行中容器镜像。
      AF_CURRENT_RUNTIME_IMAGE: ${AF_CURRENT_RUNTIME_IMAGE:-}
      AF_PREVIOUS_RUNTIME_IMAGE: ${AF_PREVIOUS_RUNTIME_IMAGE:-}
      AF_STATE_FILE: ${AF_STATE_FILE:-/data/sandbox_tasks/state.json}
      AF_SANDBOX_SKIP_ENVIRONMENT_SETUP: ${AF_SANDBOX_SKIP_ENVIRONMENT_SETUP:-true}
      AF_SANDBOX_PREINSTALLED_LIBRARIES: ${AF_SANDBOX_PREINSTALLED_LIBRARIES:-numpy,pandas,matplotlib,scipy}
      # Data-intense P0 保持一任务一容器，使内存上限与 resourceUsage 可归属到单个 attempt。
      AF_SANDBOX_CONTAINER_MAX_CONCURRENCY: ${AF_SANDBOX_CONTAINER_MAX_CONCURRENCY:-1}
      AF_SANDBOX_POOL_ENABLED: ${AF_SANDBOX_POOL_ENABLED:-false}
      AF_SANDBOX_POOL_MIN_SIZE: ${AF_SANDBOX_POOL_MIN_SIZE:-3}
      AF_SANDBOX_POOL_MAX_SIZE: ${AF_SANDBOX_POOL_MAX_SIZE:-8}
      AF_SANDBOX_POOL_ACQUIRE_TIMEOUT: ${AF_SANDBOX_POOL_ACQUIRE_TIMEOUT:-30}
      AF_SANDBOX_POOL_IDLE_TIMEOUT: ${AF_SANDBOX_POOL_IDLE_TIMEOUT:-300}
      AF_SANDBOX_POOL_MAX_CONTAINER_USES: ${AF_SANDBOX_POOL_MAX_CONTAINER_USES:-}
      AF_SANDBOX_WORKSPACE_ROOT: /sandbox/runs
      AF_SANDBOX_TASK_STORE_PATH: /data/sandbox_tasks/state.json
      AF_SANDBOX_COMPAT_INPUT_PATH: "true"
      # Nacos dynamic config（mirrors Java services）。默认关闭：生产发布时显式
      # 设 AF_CONFIG_NACOS_ENABLED=true 才启用。动态配置只能调低输出上限，不能
      # 超过代码静态硬上限；四段输出上限测试（工作包 C/D）完成前，金融计算结果
      # 通道保持关闭（Spec §7.2）。
      AF_CONFIG_NACOS_ENABLED: ${AF_CONFIG_NACOS_ENABLED:-false}
      AF_CONFIG_NACOS_NAMESPACE: ${AF_CONFIG_NACOS_NAMESPACE:-}
      AF_CONFIG_NACOS_GROUP: ${AF_CONFIG_NACOS_GROUP:-alphafrog-config}
      AF_CONFIG_NACOS_DATA_ID: ${AF_CONFIG_NACOS_DATA_ID:-python-sandbox.json}
      NACOS_ADDRESS: ${NACOS_ADDRESS:-nacos}
      NACOS_USER: ${NACOS_USER:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    volumes:
      - ./data/agent_datasets:/data/agent_datasets
      - ./data/database_fetched:/data/database_fetched
      - ./data/manifests:/data/manifests
      - ./data/agent_artifacts:/data/agent_artifacts
      - ./data/sandbox_tasks:/data/sandbox_tasks
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8095"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - alphafrog-network

  python-sandbox-gateway-service:
    image: alphafrog-micro-python-sandbox-gateway-service:latest
    build: ./pythonSandboxGatewayService
    container_name: alphafrog-python-sandbox-gateway-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
      python-sandbox-service:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      NACOS_ADDRESS: nacos
      AF_SANDBOX_SERVICE_URL: http://python-sandbox-service:8095
      # D13 release-binding: 同 Python service _MILLIS 同 substitution source;
      # Gateway Spring sandbox.service.max-task-timeout-millis 经此 env 接入,
      # 与 Python AF_SANDBOX_MAX_TASK_TIMEOUT_SECONDS 同值绑定 (a1b749ad)。
      AF_SANDBOX_MAX_TASK_TIMEOUT_MILLIS: ${AF_SANDBOX_MAX_TASK_TIMEOUT_MILLIS:-1800000}
      AF_DEBUG_OBSERVABILITY_ROOT: /app/logs/agent-debug-observability
      # Memory Optimization (Light)
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
    volumes:
      - ./data/agent-debug-observability:/app/logs/agent-debug-observability
    ports:
      - "50060:50060"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - alphafrog-network

  frontend:
    image: alphafrog-micro-frontend:latest
    build: ./frontend
    container_name: alphafrog-frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      domestic-stock-service:
        condition: service_started
      domestic-index-service:
        condition: service_started
      domestic-fund-service:
        condition: service_started
      domestic-listed-asset-service:
        condition: service_started
      admin-service:
        condition: service_started
      portfolio-service:
        condition: service_started
      agent-langchain-service:
        condition: service_started
      external-info-service:
        condition: service_started
      domestic-fetch-service:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      AF_RABBITMQ_HOST: rabbitmq
      AF_RABBITMQ_PORT: 5672
      AF_RABBITMQ_USER: ${AF_RABBITMQ_USER:-alphafrog}
      AF_RABBITMQ_PASS: ${AF_RABBITMQ_PASS:-Excited1s}
      AF_REDIS_HOST: redis
      AF_REDIS_PORT: 6379
      AF_REDIS_PASSWORD: ${AF_REDIS_PASSWORD:-Excited1s}
      NACOS_ADDRESS: nacos
      # 可选：覆盖 JWT 密钥（默认值在 frontend 的 application.yml 里）
      # AF_JWT_SECRET: ${AF_JWT_SECRET}
      AF_DOMESTIC_FETCH_DEBUG_BASE_URL: http://domestic-fetch-service:18082
      AF_CONFIG_NACOS_ENABLED: "true"
      AF_CONFIG_NACOS_NAMESPACE: ${AF_CONFIG_NACOS_NAMESPACE:-}
      AGENT_LANGCHAIN_PROVIDER_DUBBO_GROUP: ${AGENT_LANGCHAIN_PROVIDER_DUBBO_GROUP:-langchain}
      # Auth debug observability output root (must match volume mount below)
      AF_DEBUG_OBSERVABILITY_OUTPUT_ROOT: /app/logs/agent-debug-observability
      # Memory Optimization (Medium)
      JAVA_TOOL_OPTIONS: "-Xms384m -Xmx512m"
    volumes:
      - ./data/agent-debug-observability:/app/logs/agent-debug-observability
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 1280M
    networks:
      - alphafrog-network

volumes:
  alphafrog_pgdata:
  alphafrog_redisdata:
  alphafrog_rabbitmq:

networks:
  alphafrog-network:
    driver: bridge
    # 勿在已运行的 stack 上改 driver_opts：compose 会尝试删网重建，其它容器仍挂网时会失败。
    # 若需 enable_icc，须 docker compose down 后全栈 up（见 deploy 文档 / thread e13717e0）。
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
  shared-infra:
    name: shared-infra
    external: true            # 不创建，使用已存在的网络（由 ~/infra/docker-compose.yml 管理）
