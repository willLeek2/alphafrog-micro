        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      AF_REDIS_HOST: redis
      AF_REDIS_PASSWORD: ${AF_REDIS_PASSWORD:-Excited1s}
      AF_MEILI_HOST: http://meilisearch:7700
      AF_MEILI_API_KEY: ${AF_MEILI_API_KEY:-alphafrog_search_key}
      NACOS_ADDRESS: nacos
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      # Memory Optimization (Compressed)
      JAVA_OPTS: >-
        -XX:+UseSerialGC
        -Xss512k
        -Xms64m
        -Xmx200m
        -XX:MaxRAM=420m
        -XX:MaxMetaspaceSize=128m
    ports:
      - "50052:50052"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    networks:
      - alphafrog-network

  domestic-listed-asset-service:
    image: alphafrog-micro-domestic-listed-asset-service:latest
    build: ./domesticListedAssetService
    container_name: alphafrog-domestic-listed-asset-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      AF_MEILI_HOST: http://meilisearch:7700
      AF_MEILI_API_KEY: ${AF_MEILI_API_KEY:-alphafrog_search_key}
      NACOS_ADDRESS: nacos
      # Memory Optimization (Compressed)
      JAVA_OPTS: >-
        -XX:+UseSerialGC
        -Xss512k
        -Xms64m
        -Xmx200m
        -XX:MaxRAM=420m
        -XX:MaxMetaspaceSize=128m
    ports:
      - "50062:50062"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    networks:
      - alphafrog-network

  domestic-fetch-service:
    image: alphafrog-micro-domestic-fetch-service:latest
    build: ./domesticFetchService
    container_name: alphafrog-domestic-fetch-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      AF_RABBITMQ_HOST: rabbitmq
      AF_RABBITMQ_PORT: 5672
      AF_RABBITMQ_USER: ${AF_RABBITMQ_USER:-alphafrog}
      AF_RABBITMQ_PASS: ${AF_RABBITMQ_PASS:-Excited1s}
      AF_REDIS_HOST: redis
      AF_REDIS_PASSWORD: ${AF_REDIS_PASSWORD:-Excited1s}
      NACOS_ADDRESS: nacos
      NACOS_USER: ${NACOS_USER:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      AF_DOMESTIC_FETCH_HTTP_PORT: 18082
      LOGGING_LEVEL_APP: ${LOGGING_LEVEL_APP:-INFO}
      AF_FETCH_CONCURRENCY: ${AF_FETCH_CONCURRENCY:-3}
      AF_CONFIG_NACOS_ENABLED: "true"
      AF_CONFIG_NACOS_NAMESPACE: ${AF_CONFIG_NACOS_NAMESPACE:-}
      AF_CONFIG_NACOS_GROUP: "alphafrog-config"
      AF_FETCH_JOBS_CONFIG_FILE: "/app/config-dynamic/fetch-jobs.json"
      AF_FETCH_JOBS_CONFIG_REFRESH_INTERVAL_MS: 10000
      # Memory Optimization (Compressed)
      JAVA_OPTS: >-
        -XX:+UseSerialGC
        -Xss512k
        -Xms64m
        -Xmx200m
        -XX:MaxRAM=420m
        -XX:MaxMetaspaceSize=128m
    volumes:
      - ./domesticFetchService/config:/app/config:ro
      - ./data/domestic-fetch-configs:/app/config-dynamic
    ports:
      - "20882:20882"
    expose:
      - "18082"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    networks:
      - alphafrog-network

  admin-service:
    image: alphafrog-micro-admin-service:latest
    build: ./adminService
    container_name: alphafrog-admin-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      NACOS_ADDRESS: nacos
      ADMIN_MAGIC_PASSWORD: ${ADMIN_MAGIC_PASSWORD:-frog20191127StartFromBelieving}
      # Memory Optimization (Compressed)
      JAVA_OPTS: >-
        -XX:+UseSerialGC
        -Xss512k
        -Xms64m
        -Xmx200m
        -XX:MaxRAM=420m
        -XX:MaxMetaspaceSize=128m
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    networks:
      - alphafrog-network

  portfolio-service:
    image: alphafrog-micro-portfolio-service:latest
    build: ./portfolioService
    container_name: alphafrog-portfolio-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      AF_RABBITMQ_HOST: rabbitmq
      AF_RABBITMQ_PORT: 5672
      AF_RABBITMQ_USER: ${AF_RABBITMQ_USER:-alphafrog}
      AF_RABBITMQ_PASS: ${AF_RABBITMQ_PASS:-Excited1s}
      NACOS_ADDRESS: nacos
      NACOS_USER: ${NACOS_USER:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      # Memory Optimization (Compressed)
      JAVA_OPTS: >-
        -XX:+UseSerialGC
        -Xss512k
        -Xms64m
        -Xmx200m
        -XX:MaxRAM=420m
        -XX:MaxMetaspaceSize=128m
    ports:
      - "50056:50056"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    networks:
      - alphafrog-network

  agent-langchain-service:
    image: alphafrog-micro-agent-langchain-service:latest
    build: ./agentLangchainService
    container_name: alphafrog-agent-langchain-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      AF_REDIS_HOST: redis
      AF_REDIS_PORT: 6379
      AF_REDIS_PASSWORD: ${AF_REDIS_PASSWORD:-Excited1s}
      NACOS_ADDRESS: nacos
      # LangChain agent provider（与 legacy 隔离）
      SPRING_PROFILES_ACTIVE: langchain-provider
      AGENT_LANGCHAIN_PROVIDER_ENABLED: "true"
      AGENT_LANGCHAIN_PROVIDER_DUBBO_GROUP: langchain
      AGENT_LANGCHAIN_TRAFFIC_CANARY_PERCENT: ${AGENT_LANGCHAIN_TRAFFIC_CANARY_PERCENT:-0}
      AGENT_LANGCHAIN_DUBBO_PORT: 50059
      AGENT_LANGCHAIN_SERVER_PORT: 50158
      # Agent LLM 配置（使用 agentLangchainService/config 作为共享静态 prompt/config 目录）
      AF_AGENT_LLM_CONFIG_FILE: ${AF_AGENT_LLM_CONFIG_FILE:-/app/config-dynamic/agent-llm.local.json}
      AF_FINANCE_RECORD_CHANNEL_CONFIG_FILE: ${AF_FINANCE_RECORD_CHANNEL_CONFIG_FILE:-/app/config-dynamic/finance-record-channel.local.json}
      AF_FINANCE_RECORD_CHANNEL_ENABLED: "false"
      AF_AGENT_LLM_PROMPT_BASE_DIR: ${AF_AGENT_LLM_PROMPT_BASE_DIR:-/app/config}
      AF_AGENT_API_KEY: ${AF_AGENT_API_KEY:-demo}
      AF_AGENT_DEFAULT_ENDPOINT: ${AF_AGENT_DEFAULT_ENDPOINT:-openrouter}
      AF_AGENT_DEFAULT_MODEL: ${AF_AGENT_DEFAULT_MODEL:-openai/gpt-5.2}
      AF_AGENT_MODELS: ${AF_AGENT_MODELS:-openai/gpt-5.2,openai/gpt-5.1,google/gemini-3-pro-preview,moonshotai/kimi-k2.5,accounts/fireworks/models/kimi-k2p5}
      AF_AGENT_ENDPOINT_OPENROUTER: ${AF_AGENT_ENDPOINT_OPENROUTER:-https://openrouter.ai/api/v1}
      AF_AGENT_ENDPOINT_OPENAI: ${AF_AGENT_ENDPOINT_OPENAI:-https://api.openai.com/v1}
      AF_AGENT_ENDPOINT_FIREWORKS: ${AF_AGENT_ENDPOINT_FIREWORKS:-https://api.fireworks.ai/inference/v1}
      AF_AGENT_ENDPOINT_OPENROUTER_API_KEY: ${AF_AGENT_ENDPOINT_OPENROUTER_API_KEY:-}
      AF_AGENT_ENDPOINT_OPENAI_API_KEY: ${AF_AGENT_ENDPOINT_OPENAI_API_KEY:-}
      AF_AGENT_ENDPOINT_FIREWORKS_API_KEY: ${AF_AGENT_ENDPOINT_FIREWORKS_API_KEY:-}
      AF_AGENT_ENDPOINT_DASHSCOPE_API_KEY: ${AF_AGENT_ENDPOINT_DASHSCOPE_API_KEY:-}
      AF_AGENT_ENDPOINT_DASHSCOPE_SG_API_KEY: ${AF_AGENT_ENDPOINT_DASHSCOPE_SG_API_KEY:-}
      AF_AGENT_ENDPOINT_DASHSCOPE_CN_API_KEY: ${AF_AGENT_ENDPOINT_DASHSCOPE_CN_API_KEY:-}
      AF_AGENT_BASE_URL: ${AF_AGENT_BASE_URL:-https://openrouter.ai/api/v1}
      AF_AGENT_MODEL_NAME: ${AF_AGENT_MODEL_NAME:-openai/gpt-5.2}
      AF_AGENT_MAX_TOKENS: ${AF_AGENT_MAX_TOKENS:-4096}
      AF_AGENT_TEMPERATURE: ${AF_AGENT_TEMPERATURE:-0.7}
      AF_AGENT_REASONING_EFFORT: ${AF_AGENT_REASONING_EFFORT:-}
      AF_AGENT_REASONING_MAX_TOKENS: ${AF_AGENT_REASONING_MAX_TOKENS:-}
      AF_AGENT_REASONING_ENABLED: ${AF_AGENT_REASONING_ENABLED:-}
      AF_AGENT_REASONING_EXCLUDE: ${AF_AGENT_REASONING_EXCLUDE:-false}
      LOGGING_LEVEL_AGENT: ${LOGGING_LEVEL_AGENT:-INFO}
      # Market-data dataset / manifest 开关
      AF_AGENT_MARKET_DATA_DATASET_ENABLED: "true"
      AF_AGENT_MARKET_DATA_BATCH_EMIT_MANIFEST: "true"
      AF_CONFIG_NACOS_ENABLED: "true"
      AF_CONFIG_NACOS_NAMESPACE: ${AF_CONFIG_NACOS_NAMESPACE:-}
      AF_CONFIG_NACOS_DATA_ID: "code-refine.json"
      AF_CONFIG_NACOS_GROUP: "alphafrog-config"
      AF_AGENT_FLOW_CODE_REFINE_CONFIG_FILE: "/app/config-dynamic/code-refine.local.json"
      AF_DEBUG_OBSERVABILITY_ROOT: /app/logs/agent-debug-observability
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g ${AF_JAVA_PROXY_OPTIONS--Dhttp.proxyHost=host.docker.internal -Dhttp.proxyPort=7890 -Dhttps.proxyHost=host.docker.internal -Dhttps.proxyPort=7890 -Dhttp.nonProxyHosts=localhost|127.0.0.1|nacos|redis|rabbitmq|meilisearch|host.docker.internal}"
      <<: *agent-llm-proxy-env
      NO_PROXY: ${NO_PROXY-localhost,127.0.0.1,nacos,redis,rabbitmq,meilisearch,host.docker.internal}
      no_proxy: ${NO_PROXY-localhost,127.0.0.1,nacos,redis,rabbitmq,meilisearch,host.docker.internal}
    volumes:
      - ./data/agent_datasets:/data/agent_datasets
      - ./data/database_fetched:/data/database_fetched
      - ./data/manifests:/data/manifests
      - ./data/agent_artifacts:/data/agent_artifacts
      - ./data/agent_workspaces:/data/agent_workspaces
      - ./agentPlatformShared/src/main/resources/agent_guides:/data/agent_guides:ro
      - ./agentLangchainService/config:/app/config:ro
      - ./data/agent-configs:/app/config-dynamic
      - ./data/agent-debug-observability:/app/logs/agent-debug-observability
    ports:
      - "50059:50059"
      - "50158:50158"
    deploy:
      resources:
        limits:
          memory: 1.5G
    networks:
      - alphafrog-network

  external-info-service:
    image: alphafrog-micro-external-info-service:latest
    build: ./externalInfoService
    container_name: alphafrog-external-info-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
