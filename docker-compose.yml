# Agent LLM（OpenRouter 等）经宿主机 HTTP 代理出网。在 .env 中显式设置 HTTP_PROXY= 与 AF_JAVA_PROXY_OPTIONS= 可关闭。
x-agent-llm-proxy-env: &agent-llm-proxy-env
  HTTP_PROXY: ${HTTP_PROXY-http://host.docker.internal:7890}
  HTTPS_PROXY: ${HTTPS_PROXY-http://host.docker.internal:7890}
  http_proxy: ${HTTP_PROXY-http://host.docker.internal:7890}
  https_proxy: ${HTTPS_PROXY-http://host.docker.internal:7890}

services:
  # postgres:  <-- 用户使用的是宿主机 PG
  #   image: postgres:16-alpine
  #   container_name: alphafrog-postgres
  #   environment:
  #     POSTGRES_DB: ${AF_DB_MAIN_DATABASE:-alphafrog}
  #     POSTGRES_USER: ${AF_DB_MAIN_USER:-alphafrog}
  #     POSTGRES_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - alphafrog_pgdata:/var/lib/postgresql/data
  #     - ./portfolio_schema.sql:/docker-entrypoint-initdb.d/10_portfolio_schema.sql:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20
  #   networks:
  #     - alphafrog-network

  redis:
    image: redis:7-alpine
    container_name: alphafrog-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${AF_REDIS_PASSWORD:-Excited1s}", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - alphafrog_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AF_REDIS_PASSWORD:-Excited1s}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1280M
    networks:
      - alphafrog-network

  # zookeeper/kafka: 已移除，迁移至 RabbitMQ

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: alphafrog-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${AF_RABBITMQ_USER:-alphafrog}
      RABBITMQ_DEFAULT_PASS: ${AF_RABBITMQ_PASS:-Excited1s}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        +P 1048576
        +sbwt none
        +sbwtdcpu none
        +sbwtdio none
        -rabbit vm_memory_high_watermark 0.70
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - alphafrog_rabbitmq:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphafrog-network

  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: alphafrog-nacos
    environment:
      MODE: standalone
      # 生产环境下 hostname 可能是容器随机名，Dubbo/Nacos 客户端未必能稳定解析，统一改为 IP 暴露
      PREFER_HOST_MODE: ip
      NACOS_AUTH_ENABLE: "false"
      # Memory Optimization
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - alphafrog-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: alphafrog-meilisearch
    environment:
      MEILI_MASTER_KEY: ${AF_MEILI_API_KEY:-alphafrog_search_key}
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_MAX_INDEXING_MEMORY: 600Mb
      MEILI_MAX_INDEXING_THREADS: 1
      MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE: "true"
      MEILI_EXPERIMENTAL_SEARCH_QUEUE_SIZE: 100
    ports:
      - "7700:7700"
    volumes:
      - ./data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - alphafrog-network

  domestic-stock-service:
    image: alphafrog-micro-domestic-stock-service:latest
    build: ./domesticStockService
    container_name: alphafrog-domestic-stock-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      AF_DB_MAIN_HOST: ${AF_DB_MAIN_HOST:-host.docker.internal}
      AF_DB_MAIN_PORT: 5432
      AF_DB_MAIN_DATABASE: ${AF_DB_MAIN_DATABASE:-alphafrog}
      AF_DB_MAIN_USER: ${AF_DB_MAIN_USER:-alphafrog}
      AF_DB_MAIN_PASSWORD: ${AF_DB_MAIN_PASSWORD:-alphafrog_pass}
      AF_REDIS_HOST: redis
      AF_REDIS_PASSWORD: ${AF_REDIS_PASSWORD:-Excited1s}
      AF_MEILI_HOST: http://meilisearch:7700
      AF_MEILI_API_KEY: ${AF_MEILI_API_KEY:-alphafrog_search_key}
      NACOS_ADDRESS: nacos
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      # Memory Optimization (Compressed)
      # domestic-stock-service 集成较重（Dubbo+MeiliSearch+Redis），Metaspace 需要更多空间
      JAVA_OPTS: >-
        -XX:+UseSerialGC
        -Xss512k
        -Xms64m
        -Xmx200m
        -XX:MaxRAM=420m
        -XX:MaxMetaspaceSize=128m
    ports:
      - "50055:50055"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    networks:
      - alphafrog-network

  domestic-index-service:
    image: alphafrog-micro-domestic-index-service:latest
    build: ./domesticIndexService
    container_name: alphafrog-domestic-index-service
