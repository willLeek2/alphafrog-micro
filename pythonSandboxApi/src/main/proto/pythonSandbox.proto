syntax = "proto3";

package world.willfrog.alphafrogmicro.sandbox.idl;

option java_multiple_files = true;
option java_package = "world.willfrog.alphafrogmicro.sandbox.idl";
option java_outer_classname = "PythonSandboxProto";

message ExecuteRequest {
  string datasetId = 1;
  string code = 2;
  repeated string files = 3;
  repeated string libraries = 4;
  double timeoutSeconds = 5;
  repeated string datasetIds = 6;
  // 260623-harness-optimization-02: paths_dataset.csv 内容（run 级编号 → sandbox 路径映射）
  string pathsDatasetCsv = 7;
  // 260623-harness-optimization-02: path_manifest.csv 内容（manifest 元信息）
  string pathManifestCsv = 8;
  // data-intense P0：资源分类与容量估算，仅增加字段，旧客户端可以不传。
  string resourceClass = 9;
  int64 estimatedRows = 10;
  int64 estimatedBytes = 11;
  int32 fileCount = 12;
  int32 capacityUnits = 13;
  // 幂等身份与由共享 canonical contract 计算的请求指纹。
  string operationId = 14;
  string requestFingerprint = 15;
  int64 memoryLimitBytes = 16;
  int64 timeoutMillis = 17;
  string runtimeEnvironmentVersion = 18;
  // CanonicalSandboxCreateSpec 剩余组件。Sandbox 必须结合 14/9/16/17/18
  // 按共享 UTF-8 length-prefix 契约重算 requestFingerprint，不得直接信任字段 15。
  string canonicalSpecSchemaVersion = 19;
  string codeHash = 20;
  string immutableDatasetSnapshotDigest = 21;
  string librariesDigest = 22;
  string sandboxOptionsDigest = 23;
}

message ExecuteResponse {
  string taskId = 1;
  string status = 2;
  string error = 3;
  bool existing = 4;
  string requestFingerprint = 5;
}

message GetTaskStatusRequest {
  string taskId = 1;
}

message TaskStatusResponse {
  string taskId = 1;
  string status = 2; // QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED
  string startedAt = 3;
  string finishedAt = 4;
  string error = 5;
}

message GetTaskResultRequest {
  string taskId = 1;
}

message TaskResultResponse {
  string taskId = 1;
  string status = 2;
  int32 exitCode = 3;
  string stdout = 4;
  string stderr = 5;
  string datasetDir = 6;
  string error = 7;
  SandboxResourceUsage resourceUsage = 8;
  // Harness-owned terminal classification. Presence is required: missing must
  // never be interpreted as the proto3 default false by downstream finalizers.
  optional bool retryable = 9;
  // 260808-finance-methodspec-v5: v5 金融记录通道元数据。父消息存在才消费；
  // 字段存在性按 presence 语义（has*()），不得读 proto3 默认值。
  FinanceRecordChannelMetadata financeRecordChannel = 10;
  // 260808-finance-methodspec-v5: 实际容器环境身份，proto 11 为权威值。
  // 无 runtimeImageRef（Python 内部 C/H 任务事实，不进 DTO）。
  SandboxEnvironmentIdentity executionEnvironment = 11;
}

message SandboxResourceUsage {
  string resourceClass = 1;
  optional int64 cpuMillis = 2;
  optional int64 memoryPeakBytes = 3;
  optional int64 memoryByteMillis = 4;
  optional int64 logicalBytesScanned = 5;
  optional int64 artifactBytesWritten = 6;
  optional int64 temporaryBytesWritten = 7;
  optional int64 queueWaitMillis = 8;
  optional int64 prepareMillis = 9;
  optional int64 executionWallMillis = 10;
  optional int64 cleanupMillis = 11;
  optional int32 datasetOpenCount = 12;
  string exitReason = 13;
  bool oomKilled = 14;
  bool timedOut = 15;
  bool attributionComplete = 16;
  optional int64 samplingIntervalMillis = 17;
  repeated string missingFields = 18;
}

// 260808-finance-methodspec-v5: Python 沙箱返回给 Java 网关的实际通道元数据。
// presence 语义：父消息不存在表示旧生产方尚未实现 v5 协议，不得把 proto3
// 默认值当作完整批次。父消息存在但父字段未设，按"已实现但未取样"处理。
// 顺序按 FROZEN 契约文档 7c695371 第 5.2 节锁定。
message FinanceRecordChannelMetadata {
  int32 emittedRecordCount = 1;
  int64 emittedRecordBytes = 2;
  bool recordSetComplete = 3;
  string dropReason = 4;
  string recordDigest = 5;
  bool stdoutTruncated = 6;
  bool stderrTruncated = 7;
}

message SandboxPackageApi {
  string name = 1;
  string version = 2;
  string apiVersion = 3;
}

// 容器启动后由 Python runtime_environment.py 单源采集。
// 同一份采集结果同时写入 {workdir}/runtime-environment.json 与 HTTP 顶层
// executionEnvironment 字段，避免 Java 与 Python 端分别计算产生不同值。
message SandboxEnvironmentIdentity {
  string environmentId = 1;
  string imageDigest = 2;
  string librarySetDigest = 3;
  repeated SandboxPackageApi packageApis = 4;
  bool inventoryComplete = 5;
}

message GetTaskByOperationIdRequest {
  string operationId = 1;
}

message GetTaskByOperationIdResponse {
  bool found = 1;
  string taskId = 2;
  string status = 3;
  string requestFingerprint = 4;
  string error = 5;
}

service PythonSandboxService {
  rpc createTask(ExecuteRequest) returns (ExecuteResponse);
  rpc getTaskStatus(GetTaskStatusRequest) returns (TaskStatusResponse);
  rpc getTaskResult(GetTaskResultRequest) returns (TaskResultResponse);
  rpc getTaskByOperationId(GetTaskByOperationIdRequest) returns (GetTaskByOperationIdResponse);
}
