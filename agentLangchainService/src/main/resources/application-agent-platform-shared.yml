# Shared agent platform config for active agent runtimes.
agent:
  # D04 统一存储路径门面（AgentStoragePaths，W5 task #105）：
  # 解析顺序 = 新键 → 旧键别名 → 代码默认值；空白值视为未设置，回退旧键。
  # 旧→新映射与迁移注意见 agentPlatformShared/docs/d04-storage-key-mapping-v1.md。
  # 路径键无 Nacos 热更通道，根迁移只能走重启级发布。
  storage:
    workspace-root: ${AF_AGENT_STORAGE_WORKSPACE_ROOT:}
    artifact-root: ${AF_AGENT_STORAGE_ARTIFACT_ROOT:}
    dataset-root: ${AF_AGENT_STORAGE_DATASET_ROOT:}
    observability-debug-file: ${AF_AGENT_STORAGE_OBSERVABILITY_DEBUG_FILE:}
  finance-record-channel:
    # 四段上限实测完成前保持关闭；动态配置只能在以下应用默认值和代码硬上限内缩小。
    enabled: ${AF_FINANCE_RECORD_CHANNEL_ENABLED:false}
    config-file: ${AF_FINANCE_RECORD_CHANNEL_CONFIG_FILE:}
    config-refresh-interval-ms: ${AF_FINANCE_RECORD_CHANNEL_CONFIG_REFRESH_INTERVAL_MS:10000}
    record-count-max: ${AF_FINANCE_RECORD_COUNT_MAX:128}
    record-max-bytes: ${AF_FINANCE_RECORD_MAX_BYTES:16384}
    record-channel-max-bytes: ${AF_FINANCE_RECORD_CHANNEL_MAX_BYTES:262144}
    stdout-max-bytes: ${AF_FINANCE_STDOUT_MAX_BYTES:1048576}
    stderr-max-bytes: ${AF_FINANCE_STDERR_MAX_BYTES:262144}
  tool-job:
    # durable 工具的同步快路径；超过该阈值后 Run 先落 checkpoint，再转 WAITING_TOOL_JOB。
    fast-path-ms: ${AF_AGENT_TOOL_JOB_FAST_PATH_MS:1500}
    # 默认只允许当前进程的 continuation tracker 发现并续接长工具；旧的跨进程
    # reconciler/startup/heartbeat 只有显式开启后才注册，避免两套恢复链同时接管。
    durable-recovery-enabled: ${AF_AGENT_TOOL_JOB_DURABLE_RECOVERY_ENABLED:false}
    continuation-max-consecutive-poll-failures: ${AF_AGENT_TOOL_JOB_CONTINUATION_MAX_FAILURES:5}
  # D06 production sub-agent execution. The executor is bounded and independent
  # from the main Agent worker pool. A task timeout is best-effort interrupt;
  # terminal state is persisted before any late completion can win.
  sub-agent:
    executor:
      core-pool-size: ${AF_AGENT_SUB_AGENT_EXECUTOR_CORE_POOL_SIZE:3}
      max-pool-size: ${AF_AGENT_SUB_AGENT_EXECUTOR_MAX_POOL_SIZE:6}
      queue-capacity: ${AF_AGENT_SUB_AGENT_EXECUTOR_QUEUE_CAPACITY:24}
    max-wait-millis: ${AF_AGENT_SUB_AGENT_MAX_WAIT_MILLIS:30000}
    default-wait-millis: ${AF_AGENT_SUB_AGENT_DEFAULT_WAIT_MILLIS:5000}
    task-timeout-millis: ${AF_AGENT_SUB_AGENT_TASK_TIMEOUT_MILLIS:120000}
    result-max-chars: ${AF_AGENT_SUB_AGENT_RESULT_MAX_CHARS:4096}
  call-detail:
    ttl-seconds: ${AF_AGENT_CALL_DETAIL_TTL_SECONDS:86400}
  call-raw-content:
    ttl-seconds: ${AF_AGENT_CALL_RAW_CONTENT_TTL_SECONDS:7200}
  run:
    interrupted-ttl-days: ${AF_AGENT_RUN_INTERRUPTED_TTL_DAYS:7}
    checkpoint-version: ${AF_AGENT_RUN_CHECKPOINT_VERSION:v2}
    budget:
      max-wall-clock-ms: ${AF_AGENT_RUN_BUDGET_MAX_WALL_CLOCK_MS:600000}
      max-llm-calls: ${AF_AGENT_RUN_BUDGET_MAX_LLM_CALLS:50}
      max-tool-calls: ${AF_AGENT_RUN_BUDGET_MAX_TOOL_CALLS:30}
      max-tokens: ${AF_AGENT_RUN_BUDGET_MAX_TOKENS:300000}
      max-http-attempts-per-logical-call: ${AF_AGENT_RUN_BUDGET_MAX_HTTP_ATTEMPTS_PER_LOGICAL_CALL:3}
  workflow-restart:
    # 当前只允许单 Agent 实例启用；多实例前必须关闭或升级为有租约的所有权协议。
    enabled: ${AF_AGENT_WORKFLOW_RESTART_ENABLED:true}
    max-restart-attempts: ${AF_AGENT_WORKFLOW_MAX_RESTART_ATTEMPTS:1}
    scan-limit: ${AF_AGENT_WORKFLOW_RESTART_SCAN_LIMIT:100}
    checkpoint:
      max-json-chars: ${AF_AGENT_WORKFLOW_CHECKPOINT_MAX_JSON_CHARS:262144}
      max-output-chars-per-todo: ${AF_AGENT_WORKFLOW_CHECKPOINT_MAX_TODO_OUTPUT_CHARS:32768}
      max-output-chars-per-run: ${AF_AGENT_WORKFLOW_CHECKPOINT_MAX_RUN_OUTPUT_CHARS:131072}
  langchain:
    run:
      # 这是 LangchainRunExecutorLimitsResolver 实际读取的命名空间。
      # 这些值作为兼容根配置会被 hard 上限夹紧；超出 hard 时 effective=hard，需滚动重启才能扩大。
      # 真正的 hot-reload 途径是 agent-llm.local.example.json 中 executor.parallel.current。
      executor:
        core-pool-size: ${AF_AGENT_RUN_EXECUTOR_CORE_POOL_SIZE:10}
        max-pool-size: ${AF_AGENT_RUN_EXECUTOR_MAX_POOL_SIZE:10}
        queue-capacity: ${AF_AGENT_RUN_EXECUTOR_QUEUE_CAPACITY:100}
        # 修改 thread-name-prefix 与启动 hard 值不同时实际不会生效，需滚动重启
        thread-name-prefix: ${AF_AGENT_RUN_EXECUTOR_THREAD_NAME_PREFIX:agent-run-}
      scheduler:
        max-capacity-units: ${AF_AGENT_RUN_SCHEDULER_MAX_CAPACITY_UNITS:4}
        advanced-diagnostics-enabled: ${AF_AGENT_RUN_SCHEDULER_ADVANCED_DIAGNOSTICS_ENABLED:false}
  tool-cache:
    version: ${AF_AGENT_TOOL_CACHE_VERSION:v1}
    search-ttl-seconds: ${AF_AGENT_TOOL_CACHE_SEARCH_TTL_SECONDS:3600}
    info-ttl-seconds: ${AF_AGENT_TOOL_CACHE_INFO_TTL_SECONDS:21600}
    dataset-ttl-seconds: ${AF_AGENT_TOOL_CACHE_DATASET_TTL_SECONDS:604800}
  api:
    max-polling-interval-seconds: ${AF_AGENT_API_MAX_POLLING_INTERVAL_SECONDS:3}
  credit:
    default-tool-cost: ${AF_AGENT_CREDIT_DEFAULT_TOOL_COST:1}
    execute-python-cost: ${AF_AGENT_CREDIT_EXECUTE_PYTHON_COST:5}
  observability:
    debug-file:
      enabled: ${AF_AGENT_OBS_DEBUG_FILE_ENABLED:false}
      path: ${AF_AGENT_OBS_DEBUG_FILE_PATH:/data/logs/agent-observability-debug.log}
    llm-trace:
      enabled: ${AF_AGENT_OBS_LLM_TRACE_ENABLED:false}
      max-calls: ${AF_AGENT_OBS_LLM_TRACE_MAX_CALLS:100}
      max-text-chars: ${AF_AGENT_OBS_LLM_TRACE_MAX_TEXT_CHARS:20000}
      capture-cached-tokens: ${AF_AGENT_OBS_CAPTURE_CACHED_TOKENS:true}
    raw-http:
      enabled: ${AF_AGENT_OBS_RAW_HTTP_ENABLED:true}
      capture-body-max-chars: ${AF_AGENT_OBS_RAW_HTTP_MAX_CHARS:1572864}
      capture-headers: ${AF_AGENT_OBS_RAW_HTTP_HEADERS:true}
      generate-curl: ${AF_AGENT_OBS_RAW_HTTP_CURL:true}
      capture-endpoints: ${AF_AGENT_OBS_CAPTURE_ENDPOINTS:}
      exclude-endpoints: ${AF_AGENT_OBS_EXCLUDE_ENDPOINTS:}
    openrouter:
      cost-enrichment:
        enabled: ${AF_AGENT_OBS_OPENROUTER_COST_ENABLED:false}
        timeout-ms: ${AF_AGENT_OBS_OPENROUTER_COST_TIMEOUT_MS:5000}
        max-attempts: ${AF_AGENT_OBS_OPENROUTER_COST_MAX_ATTEMPTS:3}
        retry-delay-ms: ${AF_AGENT_OBS_OPENROUTER_COST_RETRY_DELAY_MS:1000}
  artifact:
    retention-days:
      normal: ${AF_AGENT_ARTIFACT_RETENTION_DAYS_NORMAL:7}
      admin: ${AF_AGENT_ARTIFACT_RETENTION_DAYS_ADMIN:30}
    download:
      max-bytes: ${AF_AGENT_ARTIFACT_DOWNLOAD_MAX_BYTES:10485760}
  event:
    payload:
      max-chars: ${AF_AGENT_EVENT_PAYLOAD_MAX_CHARS:10000}
      preview-chars: ${AF_AGENT_EVENT_PAYLOAD_PREVIEW_CHARS:4096}
  llm:
    runtime:
      execution:
        static-precheck-enabled: ${AF_AGENT_RUNTIME_EXECUTION_STATIC_PRECHECK_ENABLED:true}
        max-static-recovery-retries: ${AF_AGENT_RUNTIME_EXECUTION_MAX_STATIC_RECOVERY_RETRIES:2}
        max-runtime-recovery-retries: ${AF_AGENT_RUNTIME_EXECUTION_MAX_RUNTIME_RECOVERY_RETRIES:2}
        max-semantic-recovery-retries: ${AF_AGENT_RUNTIME_EXECUTION_MAX_SEMANTIC_RECOVERY_RETRIES:1}
        max-total-recovery-retries: ${AF_AGENT_RUNTIME_EXECUTION_MAX_TOTAL_RECOVERY_RETRIES:2}
        static-fix-endpoint: ${AF_AGENT_RUNTIME_EXECUTION_STATIC_FIX_ENDPOINT:}
        static-fix-model: ${AF_AGENT_RUNTIME_EXECUTION_STATIC_FIX_MODEL:}
        static-fix-temperature: ${AF_AGENT_RUNTIME_EXECUTION_STATIC_FIX_TEMPERATURE:0.0}
      run-budget:
        max-wall-clock-ms: ${AF_AGENT_RUN_BUDGET_MAX_WALL_CLOCK_MS:600000}
        max-llm-calls: ${AF_AGENT_RUN_BUDGET_MAX_LLM_CALLS:50}
        max-tool-calls: ${AF_AGENT_RUN_BUDGET_MAX_TOOL_CALLS:30}
        max-tokens: ${AF_AGENT_RUN_BUDGET_MAX_TOKENS:300000}
        max-http-attempts-per-logical-call: ${AF_AGENT_RUN_BUDGET_MAX_HTTP_ATTEMPTS_PER_LOGICAL_CALL:3}
      judge:
        semantic-enabled: ${AF_AGENT_RUNTIME_JUDGE_SEMANTIC_ENABLED:false}
        max-attempts: ${AF_AGENT_RUNTIME_JUDGE_MAX_ATTEMPTS:2}
        fail-open: ${AF_AGENT_RUNTIME_JUDGE_FAIL_OPEN:true}
        block-on-insufficient-evidence: ${AF_AGENT_RUNTIME_JUDGE_BLOCK_ON_INSUFFICIENT_EVIDENCE:false}
  tools:
    market-data:
      dataset:
        enabled: ${AF_AGENT_MARKET_DATA_DATASET_ENABLED:true}
        path: ${AF_AGENT_MARKET_DATA_DATASET_PATH:/data/agent_datasets}
        cache-ttl-seconds: ${AF_AGENT_MARKET_DATA_DATASET_TTL_SECONDS:604800}
        allow-range-reuse: ${AF_AGENT_MARKET_DATA_DATASET_ALLOW_RANGE_REUSE:true}
        cleanup-interval-ms: ${AF_AGENT_MARKET_DATA_DATASET_CLEANUP_INTERVAL_MS:600000}
        cleanup-scan-count: ${AF_AGENT_MARKET_DATA_DATASET_CLEANUP_SCAN_COUNT:500}
      batch:
        emit-manifest: ${AF_AGENT_MARKET_DATA_BATCH_EMIT_MANIFEST:false}
  flow:
    parallel:
      enabled: ${AF_AGENT_FLOW_PARALLEL_ENABLED:false}
    workflow:
      max-todos: ${AF_AGENT_FLOW_WORKFLOW_MAX_TODOS:10}
      max-tool-calls: ${AF_AGENT_FLOW_WORKFLOW_MAX_TOOL_CALLS:20}
      max-tool-calls-per-sub-agent: ${AF_AGENT_FLOW_WORKFLOW_MAX_TOOL_CALLS_PER_SUB_AGENT:10}
      fail-fast: ${AF_AGENT_FLOW_WORKFLOW_FAIL_FAST:false}
      default-execution-mode: ${AF_AGENT_FLOW_WORKFLOW_DEFAULT_EXECUTION_MODE:AUTO}
      sub-agent-enabled: ${AF_AGENT_FLOW_WORKFLOW_SUB_AGENT_ENABLED:true}
      sub-agent-max-steps: ${AF_AGENT_FLOW_WORKFLOW_SUB_AGENT_MAX_STEPS:6}
    code-refine:
      config-file: ${AF_AGENT_FLOW_CODE_REFINE_CONFIG_FILE:}
      max-attempts: ${AF_AGENT_FLOW_CODE_REFINE_MAX_ATTEMPTS:3}
    hitl:
      state-ttl-seconds: ${AF_AGENT_FLOW_HITL_STATE_TTL_SECONDS:3600}
  snapshot:
    default-part-size: ${AF_AGENT_SNAPSHOT_DEFAULT_PART_SIZE:524288}
    min-part-size: ${AF_AGENT_SNAPSHOT_MIN_PART_SIZE:65536}
    max-part-size: ${AF_AGENT_SNAPSHOT_MAX_PART_SIZE:2097152}
    cache-ttl-seconds: ${AF_AGENT_SNAPSHOT_CACHE_TTL_SECONDS:3600}
    gzip-enabled: ${AF_AGENT_SNAPSHOT_GZIP_ENABLED:true}

# Java 侧在调用 Sandbox 之前先做容量准入。默认值与 docker-compose 中
# AF_SANDBOX_MAX_CONCURRENCY=20 对齐，避免 Java maxUnits=4 把请求提前挡在伸缩器之外；
# 生产环境仍可根据宿主机内存独立下调这三个显式变量。
alphafrog:
  data-analysis:
    capacity:
      max-units: ${AF_DATA_ANALYSIS_CAPACITY_MAX_UNITS:20}
      max-active: ${AF_DATA_ANALYSIS_CAPACITY_MAX_ACTIVE:20}
      max-heavy-active: ${AF_DATA_ANALYSIS_CAPACITY_MAX_HEAVY_ACTIVE:6}

# D14 (Q-14): non-production Legacy create without capacity wiring.
# Default false = fail-closed. Set true ONLY together with Gateway
# `sandbox.gateway.allow-create-without-operation-id` and Python
# `AF_SANDBOX_ALLOW_CREATE_WITHOUT_OPERATION_ID` for annotated fixtures.
# Enabling only this switch is not enough: the other layers still refuse.
# NON-PRODUCTION ONLY — no global capacity admission, no idempotent recovery;
# must not point at production Gateway/Python.
sandbox:
  create:
    allow-legacy-without-capacity: ${AF_SANDBOX_ALLOW_LEGACY_WITHOUT_CAPACITY:false}
