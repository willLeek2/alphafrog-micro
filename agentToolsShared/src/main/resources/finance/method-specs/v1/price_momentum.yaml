schemaVersion: "1"
methodId: finance.momentum.price_momentum
version: 1.0.0
displayName: 价格动量
definition: N 个交易日窗口两端复权收盘比较：动量 = 复权收盘[t]/复权收盘[t-N] - 1。N 取 63/126/252（约 3/6/12 个月，按交易日历）。复权因子可选传入、方法内相乘（adj_close = close × adj_factor）；缺因子日与无行情日分开计数并跳过（缺因子不当 1.0）。不传因子时序列须已是复权口径（指数收盘即用）。
resolverHints:
  aliases: [价格动量, 动量, 区间动量]
  commonPhrases: [过去三个月涨了多少, 动量强不强]
  clarificationDimensions:
    - id: tsCodeAndWindow
      question: 哪只标的、窗口取 63/126/252 哪个
    - id: adjusted
      question: 序列是否需要方法内乘复权因子
parameters:
  closes:
    type: array
    required: true
    meaning: 按日期升序排列的收盘序列，无行情日传 null
  window:
    type: integer
    required: true
    enum: [63, 126, 252]
    meaning: 动量窗口的交易日个数（约 3/6/12 个月）
  adjFactors:
    type: array
    required: false
    meaning: 与 closes 等长的复权因子序列，缺值传 null；不传表示序列已是复权口径
conventions:
  window_ends_ratio:
    canonicalPath: 窗口两端复权收盘相除减一
    returnType: simple return
    narrativeTemplate: "{window} 个交易日窗口两端的复权收盘（收盘乘复权因子，缺因子日与无行情日分开跳过）相除减一"
outputs:
  - {name: momentum, unit: ratio, description: 窗口动量收益率, displayFormat: percent}
libraryBinding:
  package: alphafrog_finance
  function: price_momentum
  apiCompatRange: ">=1.0.0,<2.0.0"
sourceRefs:
  - method-knowledge:finance.momentum.price_momentum@1.0.0
