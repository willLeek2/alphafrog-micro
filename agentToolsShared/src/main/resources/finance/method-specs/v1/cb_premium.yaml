schemaVersion: "1"
methodId: finance.valuation.cb_premium
version: 1.0.0
displayName: 可转债转股与纯债溢价率
definition: 直接采用可转债日线接口的转股溢价率（cb_over_rate）与纯债溢价率（bond_over_rate），接口已是百分比数值；无值的键不输出。
resolverHints:
  aliases: [转股溢价率, 纯债溢价率, 转债溢价]
  commonPhrases: [转债相对正股贵多少, 转债的债底溢价多少]
  clarificationDimensions:
    - id: cbAndDate
      question: 哪只转债、哪个交易日
parameters:
  cbOverRate:
    type: number
    required: false
    meaning: 转股溢价率百分比数值，无值传 null
  bondOverRate:
    type: number
    required: false
    meaning: 纯债溢价率百分比数值，无值传 null
conventions:
  direct_use:
    canonicalPath: 接口值直接采用（百分比口径）
    returnType: percent
    narrativeTemplate: 采用可转债日线接口在目标交易日的转股溢价率与纯债溢价率（接口已是百分比数值），无值的键不输出
outputs:
  - {name: cbOverRate, unit: percent, description: 转股溢价率, displayFormat: percent}
  - {name: bondOverRate, unit: percent, description: 纯债溢价率, displayFormat: percent}
libraryBinding:
  package: alphafrog_finance
  function: cb_premium
  apiCompatRange: ">=1.0.0,<2.0.0"
sourceRefs:
  - method-knowledge:finance.valuation.cb_premium@1.0.0
