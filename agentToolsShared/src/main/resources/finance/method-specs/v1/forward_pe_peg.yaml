schemaVersion: "1"
methodId: finance.forecast.forward_pe_peg
version: 1.0.0
displayName: 预测市盈率与PEG
definition: 基于券商盈利预测（report_rc）行列表计算。方法内按机构分组、组内按预测期排序，取「同一机构、相邻预测期、当期市盈率与每股收益同行」的配对：当期行提供预测市盈率与本期每股收益，紧邻前期行提供上期每股收益，增速 g = 本期/上期 - 1，PEG = 预测市盈率/(g×100)。跨机构的有限预测市盈率与 PEG 各取中位数。只有单期预测、或算不出有限正增速时只输出预测市盈率。null 不当 0。
resolverHints:
  aliases: [预测市盈率, 前瞻市盈率, PEG, 预测PE]
  commonPhrases: [按券商预测算贵不贵, 估值和预测增速匹配吗]
  clarificationDimensions:
    - id: reportWindow
      question: 取哪个发布日期窗口内的预测报告行
parameters:
  rows:
    type: array
    required: true
    meaning: report_rc 行列表，每行为含 org_name、quarter、pe、eps 键的对象，无值字段传 null（不当 0）；同一机构同一预测期多行时方法取最后一行，调用前建议按 report_date 去重留最新
conventions:
  org_pair_median:
    canonicalPath: 机构内相邻预测期配对 + 跨机构中位数
    returnType: ratio
    narrativeTemplate: 对 report_rc 预测记录按机构分组、组内按预测期排序后配对（同一机构相邻预测期、当期市盈率与每股收益同行），跨机构的有限预测市盈率与 PEG 各取中位数；禁止取列表第一行
outputs:
  - {name: forwardPe, unit: ratio, description: 跨机构中位数预测市盈率, displayFormat: number}
  - {name: peg, unit: ratio, description: 跨机构中位数 PEG, displayFormat: number}
libraryBinding:
  package: alphafrog_finance
  function: forward_pe_peg
  apiCompatRange: ">=1.0.0,<2.0.0"
sourceRefs:
  - method-knowledge:finance.forecast.forward_pe_peg@1.0.0
