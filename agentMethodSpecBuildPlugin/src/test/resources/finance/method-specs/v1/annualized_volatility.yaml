schemaVersion: "1"
methodId: finance.risk.annualized_volatility
version: 1.0.0
displayName: 年化波动率
definition: 由一组周期收益率的样本标准差按每年期数平方根换算的年化波动率
resolverHints:
  aliases: [年化波动率, 波动率, annualized volatility]
  commonPhrases: [这只股票波动大不大, 收益率的波动程度换成年度口径是多少]
  clarificationDimensions:
    - id: rangeBoundary
      question: 希望用哪个日期或交易日区间的收益率序列
    - id: returnFrequency
      question: 收益率序列按日、周、月还是其他频率
parameters:
  returns:
    type: array
    required: true
    items: {type: number}
    meaning: 周期收益率序列，按时间先后排列，长度至少为 2
  periodsPerYear:
    type: integer
    required: true
    minimum: 1
    meaning: 每年包含的期数，例如日频取 252
  window:
    type: integer
    required: false
    minimum: 2
    meaning: 只使用序列末尾 window 个收益率；缺省使用全样本
conventions:
  period_sample_stdev_annualized:
    returnType: simple_period_returns
    stdevDdof: 1
    annualization: multiply_stdev_by_sqrt_periods_per_year
outputs:
  - {name: annualized_volatility, unit: ratio_per_annum, description: 年化波动率}
libraryBinding:
  package: alphafrog_finance
  function: annualized_volatility
  apiCompatRange: ">=1.0.0,<2.0.0"
sourceRefs:
  - method-knowledge:finance.risk.annualized_volatility@1.0.0
