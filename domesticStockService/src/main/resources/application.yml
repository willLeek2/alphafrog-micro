spring:
  application:
    name: domestic-stock-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${AF_DB_MAIN_HOST}:${AF_DB_MAIN_PORT}/${AF_DB_MAIN_DATABASE}
    username: ${AF_DB_MAIN_USER}
    password: ${AF_DB_MAIN_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
  data:
    redis:
      host: ${AF_REDIS_HOST:127.0.0.1}
      port: 6379
      password: ${AF_REDIS_PASSWORD:default}
meilisearch:
  host: ${AF_MEILI_HOST:http://localhost:7700}
  api-key: ${AF_MEILI_API_KEY:alphafrog_search_key}

server:
  tomcat:
    threads:
      max: 20
      min-spare: 5


mybatis:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: domestic-stock-service
    # 当前集群沿用 Dubbo 2 风格的接口级服务发现，显式关闭 Dubbo 3 默认的应用级双注册/双订阅
    register-mode: interface
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848
    # 当前未使用 Nacos 作为 Dubbo 配置中心，显式关闭默认兜底，避免启动时额外做 config-center 健康检查
    use-as-config-center: false
    # 当前未使用 Nacos 作为 Dubbo 元数据中心，显式关闭默认兜底，避免启动时额外做 metadata-center 健康检查
    use-as-metadata-center: false
  #    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848?username=${NACOS_USER:nacos}&password=${NACOS_PASSWORD:nacos}
  protocol:
    port: 50055
    name: tri
  consumer:
    check: false

tushare:
  token: ${TUSHARE_TOKEN}


advanced:
  meili-enabled: true
  meili-auto-sync: true

# 统一 SQL 资产取数工具：守卫与执行参数（AssetSqlGuard / AssetSqlExecutor 读取；
# 缺省值与代码内默认一致，可用环境变量覆盖）。
# max-bytes 缺省 4MiB 是对齐 Dubbo3 Triple 传输默认响应缓冲 8MiB 的结果：该默认值是
# Dubbo 3.3.2 TripleConfig.DEFAULT_MAX_RESPONSE_BODY_SIZE＝8388608，在提供方写响应侧生效
# （NettyH2StreamChannel.newOutputMessage 用它构造 LimitedByteBufOutputStream），仓库内
# 无运行时覆盖。结果集经 tri 协议一次性回传，缺省压在 8MiB 之下并留一倍余量，字节触顶时
# 模型拿到的是 truncated 结果集而不是传输层失败的 RPC。若把 AF_ASSET_SQL_MAX_BYTES 上调
# 超过 8388608，必须在提供方（本服务）同时调大响应缓冲，否则回到传输先炸的错位：
#   dubbo.protocol.triple.max-response-body-size: <不低于 AF_ASSET_SQL_MAX_BYTES 的字节数>
asset-sql:
  max-rows: ${AF_ASSET_SQL_MAX_ROWS:200000}
  max-bytes: ${AF_ASSET_SQL_MAX_BYTES:4194304}
  query-timeout-seconds: ${AF_ASSET_SQL_QUERY_TIMEOUT_SECONDS:30}
  max-concurrency: ${AF_ASSET_SQL_MAX_CONCURRENCY:4}
